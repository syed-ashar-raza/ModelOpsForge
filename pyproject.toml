[project]
name = "modelopsforge"
version = "0.1.0"
description = "Production-oriented ML lifecycle: train, evaluate, version, serve, and monitor."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mlflow>=3.0,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.22,<1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
modelops-train = "modelopsforge.cli:train"
modelops-evaluate = "modelopsforge.cli:evaluate"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "models", "mlruns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
